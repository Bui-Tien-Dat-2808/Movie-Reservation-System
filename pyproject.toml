[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["B008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=50"

[tool.coverage.run]
source = ["app"]
omit = ["app/db/init_db.py", "alembic/*"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
