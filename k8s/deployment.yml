apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-reservation-app
  labels:
    app: movie-reservation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: movie-reservation
  template:
    metadata:
      labels:
        app: movie-reservation
    spec:
      containers:
        - name: app
          image: movie-reservation-system:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: movie-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: movie-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: movie-secrets
                  key: secret-key
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: movie-secrets
                  key: tmdb-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: movie-reservation-service
spec:
  selector:
    app: movie-reservation
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
